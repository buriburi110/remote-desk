# Render 배포 설정: 시그널링 서버만 올린다 (host.py는 Windows PC에서 실행)
services:
  - type: web
    name: remote-desk-signal
    runtime: python
    plan: free
    buildCommand: pip install aiohttp
    startCommand: python signal_server.py
    envVars:
      - key: HOST_KEY
        generateValue: true
      # 선택: Cloudflare TURN 중계 (직접 연결이 안 되는 네트워크용). 값은 대시보드에서 입력
      - key: TURN_KEY_ID
        sync: false
      - key: TURN_API_TOKEN
        sync: false
